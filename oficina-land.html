/* =====================================================================
   OFICINA LAND · estilos (paleta de Candy Land aplicada a una oficina isométrica)
   Cambia los colores en :root para personalizar la interfaz.
   ===================================================================== */
:root{
  --ink:#2A2150; --paper:#FFFFFF; --cream:#FFF6E3; --sky:#BFE6FF;
  --red:#E5484D; --purple:#8E4EC6; --yellow:#F5C400; --blue:#3E8EF7; --orange:#F76B15; --green:#30A46C;
  --fd:'Fredoka','Arial Rounded MT Bold',system-ui,sans-serif; --fb:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#17102F;overflow:hidden;font-family:var(--fb);color:var(--ink)}
#viewport{position:fixed;inset:0}
#root{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center}
button{font-family:inherit;color:inherit}
.mut{opacity:.65}

/* ---------- Escenario ---------- */
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:linear-gradient(180deg,#BFE6FF 0%,#DDF1FF 40%,#FFF1D6 100%);font:600 30px/1.3 var(--fb)}
.stage.mirror{pointer-events:none}
.bgfx{position:absolute;inset:0;overflow:hidden}
.cloud{position:absolute;display:block;background:#fff;border-radius:80px;opacity:.85;animation:cloud 60s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:260px;height:70px;left:-300px;top:120px}.cloud.c1::before{width:110px;height:110px;left:30px;top:-48px}.cloud.c1::after{width:80px;height:80px;left:130px;top:-30px}
.cloud.c2{width:200px;height:56px;left:-300px;top:330px;animation-duration:85s;animation-delay:-30s}.cloud.c2::before{width:80px;height:80px;left:24px;top:-34px}.cloud.c2::after{width:60px;height:60px;left:100px;top:-22px}
.cloud.c3{width:320px;height:80px;left:-300px;top:700px;animation-duration:110s;animation-delay:-60s;opacity:.6}.cloud.c3::before{width:130px;height:130px;left:40px;top:-60px}.cloud.c3::after{width:90px;height:90px;left:170px;top:-34px}
@keyframes cloud{to{transform:translateX(2500px)}}
.board{position:absolute;left:350px;top:30px;width:1550px;height:1030px;transition:filter .4s}
.stage.dim .board{filter:blur(3px) saturate(.85)}
.board .tag text,.board .ptag text{paint-order:stroke}
.token .bob{transform-box:fill-box;transform-origin:50% 100%}
.token .bob.active{animation:bob .9s ease-in-out infinite}
.token .bob.land{animation:land .38s ease-out}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes land{0%{transform:scale(1.15,.82)}60%{transform:scale(.94,1.1)}100%{transform:none}}
.token .ring{animation:ring 1.4s ease-in-out infinite}
@keyframes ring{50%{opacity:.35}}

/* Logo y HUD */
.logo{position:absolute;left:34px;top:26px;padding:8px 26px 12px;background:#8A5A3A;border:6px solid #fff;border-radius:22px;box-shadow:0 8px 0 rgba(42,33,80,.25);transform:rotate(-2deg);color:#fff;text-align:center;line-height:1}
.logo span{display:block;font:600 26px var(--fd);letter-spacing:.14em;text-transform:uppercase}
.logo b{font:700 64px var(--fd);color:#FFD34D;text-shadow:0 4px 0 #6B4129}
.hud{position:absolute}
.hud-players{left:30px;top:150px;width:350px;display:flex;flex-direction:column;gap:16px}
.pc{position:relative;display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;background:#fff;border:5px solid var(--pc);border-radius:26px;padding:12px 18px;box-shadow:0 7px 0 rgba(42,33,80,.2);transition:transform .2s}
.pc.act{transform:scale(1.05);box-shadow:0 0 0 5px #fff,0 0 0 11px var(--pc),0 10px 0 11px rgba(42,33,80,.2)}
.pc.done{opacity:.8}
.pc b{display:block;font:600 30px/1.1 var(--fd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc strong{font:700 54px/1 var(--fd)}
.pc small{font:600 20px var(--fd);margin-left:4px;opacity:.6}
.pc .sk{position:absolute;right:14px;bottom:-14px;background:var(--red);color:#fff;font:600 20px var(--fd);padding:2px 14px;border-radius:14px;font-style:normal}
.pc .sk.ok{background:var(--green)}
.prog{height:12px;background:#E5E0F2;border-radius:8px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--pc);border-radius:8px;transition:width .6s}
.bd{display:flex;gap:2px;min-height:30px}
.tm{font:600 26px var(--fd);text-align:center;background:rgba(255,255,255,.75);border-radius:18px;padding:8px}
.hud-top{left:520px;top:28px;display:flex;gap:22px;align-items:center}
.banner{display:flex;align-items:center;gap:12px;background:#fff;border:5px solid var(--pc,#2A2150);border-radius:999px;padding:6px 34px 6px 18px;font:600 34px var(--fd);box-shadow:0 7px 0 rgba(42,33,80,.2)}
.banner b{font-weight:700}
.hud-clock{right:30px;top:30px}
.hud-clock span{display:flex;align-items:center;gap:8px;background:#fff;border:4px solid var(--ink);border-radius:999px;padding:4px 22px;font:600 28px var(--fd);box-shadow:0 5px 0 rgba(42,33,80,.2)}
.hud-clock.over span{background:var(--yellow)}
.hud-deck{right:30px;bottom:30px}
.deck{display:flex;gap:18px;align-items:flex-end}
.stack{width:150px;height:210px;border-radius:24px;background:var(--purple);border:5px solid var(--ink);color:#fff;font:600 26px var(--fd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:12px 12px 0 -2px #6A3A96,12px 12px 0 2px var(--ink);transition:transform .15s}
.stack:disabled{cursor:default;filter:grayscale(.5);opacity:.7}
.deck.can .stack{animation:pulse 1.1s infinite}
.stack:not(:disabled):hover{transform:translateY(-6px) rotate(-2deg)}
.cardface{width:190px;height:250px;border-radius:24px;background:var(--cc,#fff);border:5px solid var(--ink);color:#fff;padding:16px;display:flex;flex-direction:column;gap:10px;justify-content:center;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 8px 0 rgba(42,33,80,.25)}
.cardface b{font:700 36px/1 var(--fd)}
.cardface span{font:600 20px/1.2 var(--fb)}
.cardface.empty{background:#fff;color:#8c86a8;text-shadow:none;font:600 26px var(--fd);align-items:center;border-style:dashed}
.cardface.flip{animation:flip .6s steps(6,end)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8)}to{transform:none}}
.hud-dist{left:30px;bottom:30px;width:350px}
.dchip{background:#fff;border:5px solid var(--c);border-radius:24px;padding:12px 18px;box-shadow:0 7px 0 rgba(42,33,80,.2)}
.dchip b{display:block;font:600 26px var(--fd);color:var(--c)}
.dchip span{display:block;font:700 30px var(--fd)}
.dchip em{display:block;font:600 20px/1.25 var(--fb);font-style:normal;opacity:.8;margin-top:4px}

/* ---------- Botones ---------- */
.btn{font:600 32px/1 var(--fd);padding:16px 36px;border-radius:999px;border:4px solid var(--ink);background:var(--yellow);color:var(--ink);box-shadow:0 8px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.btn.sec{background:#fff}
.btn.big{font-size:38px;padding:20px 50px;background:var(--green);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.danger{background:var(--red);color:#fff}
.btn.s{font-size:20px;padding:8px 16px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pulse,.deck.can .stack{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.btn:focus-visible,.opt:focus-visible,.popt:focus-visible,.dopt:focus-visible,.eb:focus-visible,.mxc:focus-visible,.stack:focus-visible,.rv:focus-visible,.inp:focus-visible{outline:6px solid var(--blue);outline-offset:4px}

/* ---------- Modales ---------- */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(42,33,80,.18);padding:142px 24px 150px}
.stage.hashud .ov{padding-left:384px}
.ov.on{display:flex}
.mwrap{animation:popm .45s steps(6,end) both;max-height:1040px}
@keyframes popm{from{opacity:0;transform:translateY(40px) rotate(-2deg) scale(.92)}to{opacity:1;transform:none}}
.card{background:#fff;border:6px solid var(--ink);border-radius:36px;overflow:hidden;box-shadow:0 16px 0 rgba(42,33,80,.28),0 36px 70px rgba(42,33,80,.35);max-height:790px;display:flex;flex-direction:column}
.rib{display:flex;align-items:center;gap:16px;background:var(--rib);color:#fff;padding:14px 34px;font:600 32px var(--fd);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.rib-ico{width:64px;height:64px;margin:-8px 0;flex:none}
.cbody{padding:28px 48px 20px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.foot{padding:6px 48px 34px;display:flex;gap:22px;justify-content:flex-end;align-items:center}
.card h2{margin:0;font:700 54px/1.05 var(--fd)}
.card h2.q{font-size:42px;line-height:1.15}
.card h3{margin:0;font:700 36px/1.1 var(--fd);display:flex;align-items:center;gap:12px}
.lead{margin:0;font:600 32px/1.35 var(--fb)}
.lead.sm{font-size:27px}
.sm{font-size:26px}
.tip{margin:0;background:#FFF3C4;border-left:8px solid var(--yellow);padding:12px 18px;border-radius:12px;font:700 26px/1.3 var(--fb)}
.who{font:700 26px var(--fb);opacity:.9}
.lb{font:800 22px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:#6A5E96;margin-top:6px}
.pn{display:inline-block;background:var(--pc);color:#fff;border-radius:999px;padding:2px 20px;font:600 .95em var(--fd);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ico{width:56px;height:56px;flex:none}.ico.xs{width:30px;height:30px}.ico.s{width:38px;height:38px}.ico.m{width:62px;height:62px}.ico.l{width:96px;height:96px}.ico.xl{width:170px;height:170px}
.pawn{width:46px;height:62px;flex:none}.pawn.s{width:32px;height:44px}
.hero .cbody{gap:20px;padding-top:34px}
.logo-h{margin:0;font:700 130px/.95 var(--fd);color:var(--red);text-shadow:0 6px 0 var(--ink);-webkit-text-stroke:4px var(--ink)}
.chips3{display:flex;gap:16px;flex-wrap:wrap}.chips3 span{display:flex;align-items:center;gap:8px;background:#F4EEFF;border-radius:999px;padding:8px 22px 8px 12px;font:700 26px var(--fb)}
.prows{display:flex;flex-direction:column;gap:12px}.prow{display:flex;align-items:center;gap:16px}
.inp{width:100%;font:700 30px var(--fb);color:var(--ink);padding:12px 18px;border:4px solid var(--ink);border-radius:18px;background:#FBF8FF}
textarea.inp{font-size:22px;line-height:1.35;resize:none}
select.inp{font-size:24px;padding:10px}
.row2{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cmsg{font:700 24px var(--fb);color:var(--green)}

/* Briefing */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mini{border-radius:24px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;color:#fff;box-shadow:0 7px 0 rgba(42,33,80,.2)}

.mini.c-blue{background:var(--blue)}.mini.c-purple{background:var(--purple)}.mini.c-orange{background:var(--orange)}.mini.c-red{background:var(--red)}.mini.c-green{background:var(--green)}
.elems{display:grid;grid-template-columns:380px 1fr;gap:26px}
.elist{display:flex;flex-direction:column;gap:12px}
.eb{display:flex;align-items:center;gap:14px;background:#F4EEFF;border:4px solid transparent;border-radius:20px;padding:8px 18px 8px 10px;font:600 32px var(--fd);cursor:pointer;text-align:left}
.eb.on{background:var(--yellow);border-color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.edet{background:#F8F5FF;border-radius:24px;padding:20px 28px}.edet p{margin:0 0 8px;font:700 28px/1.3 var(--fb)}
.mxwrap{display:grid;grid-template-columns:1fr 520px;gap:30px;align-items:center}
.mxgrid{display:grid;grid-template-columns:200px 1fr 1fr;gap:12px;align-items:stretch}
.mxgrid b{display:flex;align-items:center;justify-content:center;text-align:center;font:600 26px/1.1 var(--fd);padding:8px}
.mxc{background:#F4EEFF;border:4px solid var(--ink);border-radius:20px;min-height:130px;font:700 54px var(--fd);cursor:pointer}

.steps3>div{display:flex;flex-direction:column;gap:6px;background:#F4EEFF;border-radius:24px;padding:18px 22px}.steps3 b{font:700 34px var(--fd)}.steps3 span{font:700 24px/1.3 var(--fb)}
.legend{display:flex;gap:14px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:8px;background:#F4EEFF;border-radius:999px;padding:6px 20px 6px 8px;font:700 24px var(--fb)}
.dstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.dstrip div{background:var(--c);color:#fff;border-radius:16px;padding:12px 16px;font:600 26px var(--fd);text-align:center}
.dots{display:flex;gap:10px;margin-right:auto}.dots i{width:18px;height:18px;border-radius:50%;background:#D7CEF0}.dots i.on{background:var(--ink)}

/* Eventos */
.mech{border-left:10px solid var(--c);background:#F8F5FF;border-radius:16px;padding:14px 22px}

.lesson{background:#F4EEFF;border-radius:20px;padding:16px 22px;font:700 28px/1.35 var(--fb)}
.opts{display:flex;flex-direction:column;gap:14px}

.opt:hover:not(:disabled){transform:translateY(-2px);background:#FFF9DA}
.opt i{flex:none;width:56px;height:56px;border-radius:50%;background:var(--purple);color:#fff;font:700 32px var(--fd);display:grid;place-items:center;font-style:normal}
.opt.ok{background:#D9F5E4;border-color:var(--green);box-shadow:0 6px 0 var(--green)}.opt.ok i{background:var(--green)}
.opt.no{background:#FFE3E3;border-color:var(--red);box-shadow:0 6px 0 var(--red)}.opt.no i{background:var(--red)}
.opt.dim{opacity:.5;box-shadow:none}
.opt:disabled{cursor:default}
.result{display:flex;gap:16px;align-items:center;border-radius:20px;padding:12px 22px;font:700 26px/1.3 var(--fb)}
.result b{display:block;font:700 34px var(--fd)}
.result.good{background:#D9F5E4}.result.bad{background:#FFEFD0}
.popts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.popt{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:16px 20px;font:600 22px/1.35 var(--fb);cursor:pointer;box-shadow:0 6px 0 var(--ink)}
.popt:hover:not(:disabled){background:#FFF9DA}
.popt i{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;font:700 28px var(--fd);display:grid;place-items:center;font-style:normal}
.popt em{font:800 21px/1.3 var(--fb);font-style:normal}
.popt.ok{background:#D9F5E4;border-color:var(--green);box-shadow:0 6px 0 var(--green)}.popt.no{background:#FFE3E3;border-color:var(--red)}.popt.dim{opacity:.55}
.bigbadge{display:flex;justify-content:center;animation:pulse 1.4s infinite}
.vs{display:flex;align-items:center;gap:18px;font:600 36px var(--fd)}.vs>span{font:700 26px var(--fb);opacity:.6}
.rivals{display:flex;align-items:center;gap:12px}.rv{background:#fff;border:4px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:28px}.rv.on{background:var(--yellow)}
.hush{font:700 64px/1.05 var(--fd)!important}
.dopts{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.dopt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:5px solid var(--ink);border-radius:28px;padding:26px 22px;cursor:pointer;box-shadow:0 8px 0 var(--ink);transition:transform .12s}
.dopt:hover{transform:translateY(-4px)}
.dopt.C{background:#D9F5E4}.dopt.D{background:#FFE6D1}
.dopt b{font:700 48px var(--fd)}.dopt span{font:700 24px/1.3 var(--fb)}
.timer{font:700 150px/1 var(--fd);text-align:center;color:var(--orange)}.timer.low{color:var(--red);animation:pulse .6s infinite}
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.rcard{display:flex;flex-direction:column;align-items:center;gap:6px;border:6px solid var(--pc);border-radius:28px;padding:20px;animation:popIn .5s steps(5,end) both}
.rcard.C{background:#E7F8EE}.rcard.D{background:#FFEBDD}
.rcard b{font:700 36px var(--fd)}.rcard strong{font:700 42px var(--fd)}.rcard em{font:700 52px var(--fd);font-style:normal;color:var(--green)}
@keyframes popIn{from{opacity:0;transform:translateY(24px) rotate(-3deg) scale(.94)}to{opacity:1;transform:none}}

/* Resultados */
.end3{display:grid;grid-template-columns:1fr 1.1fr 1.1fr;gap:34px}
.rk{display:grid;grid-template-columns:44px 46px 1fr auto;gap:10px;align-items:center;background:#F4EEFF;border-radius:18px;padding:8px 16px;margin-bottom:10px;font:700 30px var(--fb)}
.rk b{font:700 36px var(--fd)}.rk strong{font:700 46px var(--fd)}
.bar{position:relative;height:58px;background:#EAE4F7;border-radius:16px;overflow:hidden;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:700 24px var(--fb)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:16px}
.bar span,.bar b{position:relative}.bar b::after{content:"%"}
.brow{margin-bottom:12px}.brow>b{font:700 28px var(--fd)}.brow>div{display:flex;gap:8px;flex-wrap:wrap}
.bdg{display:flex;align-items:center;gap:6px;background:#FFF3C4;border-radius:999px;padding:3px 14px 3px 4px;font:700 22px var(--fb)}
.insight{background:var(--ink);color:#fff;border-radius:22px;padding:18px 26px;font:700 30px/1.35 var(--fb)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.wk{display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}.fgrid label{display:flex;flex-direction:column;font:800 20px var(--fb);letter-spacing:.06em;text-transform:uppercase;gap:2px}.fgrid .full{grid-column:1/-1}
.fgrid .inp{font-size:22px;padding:8px 12px}
.qlist{display:flex;gap:14px;flex-wrap:wrap}.qlist span{display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 18px 4px 8px;font:700 24px var(--fb)}.qlist .ok{background:#D9F5E4}.qlist .no{background:#FFE3E3}


/* ===================== Oficina Land en vivo ===================== */

.cr.me{background:#FFF3C4}.cr b{font:700 24px var(--fd)}.cr small{opacity:.6}.cr .fx{grid-column:1/-1;font-style:normal;font-size:20px}.fx.good{color:#1B7F4B}.fx.bad{color:#C2282D}
.mebox{position:absolute;left:30px;bottom:30px;width:340px;z-index:4;display:flex;flex-direction:column;gap:8px}
.mb{display:flex;align-items:center;gap:10px;background:#fff;border:5px solid var(--tc,#2A2150);border-radius:22px;padding:8px 16px;box-shadow:0 6px 0 rgba(42,33,80,.2)}

@keyframes fl{to{transform:translateY(-560px) rotate(14deg);opacity:0}}
.dock{position:absolute;left:30px;right:26px;bottom:104px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(42,33,80,.92);border-radius:24px;padding:10px 16px;z-index:12;box-shadow:0 8px 24px rgba(0,0,0,.3)}

.mxc.on{background:var(--yellow)}
.tabs{display:flex;gap:10px}.tabb{font:700 30px var(--fd);padding:10px 30px;border:4px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer}.tabb.on{background:var(--yellow);box-shadow:0 5px 0 var(--ink)}
.lbl{font:800 22px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:#6A5E96}.errm{color:#C2282D;font:700 26px var(--fb);margin:0}

.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-height:520px;overflow:hidden}
.tb{display:flex;align-items:center;gap:12px;background:#F8F5FF;border-left:10px solid var(--tc);border-radius:16px;padding:8px 14px}.tb b{display:block;font:700 28px var(--fd)}.tb span{font:700 22px var(--fb)}
.pl{display:inline-block;background:#F4EEFF;border-radius:999px;padding:4px 18px;margin:4px;font:700 26px var(--fb)}
.tchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--tc);border-radius:999px;padding:2px 14px}
.items{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.item{display:flex;align-items:center;gap:8px;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:6px 16px 6px 8px;cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--ink)}
.item b{font:700 26px var(--fd)}.item span{font:700 20px/1.2 var(--fb);max-width:300px}.item.on{background:#FFF3C4}
.rbar{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:#F4EEFF;border-radius:14px;padding:8px 16px;margin-bottom:8px;overflow:hidden;font:700 24px/1.25 var(--fb)}
.rbar u{position:absolute;left:0;top:0;bottom:0;background:rgba(62,142,247,.25);text-decoration:none}.rbar.ok u{background:rgba(48,164,108,.35)}
.rbar>*{position:relative}.rbar span{flex:1}.rbar b{font:700 26px var(--fd)}.rbar em{flex-basis:100%;font:700 20px var(--fb);font-style:normal;color:#4E4476}
.prs{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:hidden}
.pr{display:grid;grid-template-columns:34px 190px 1fr 1fr auto;gap:12px;align-items:center;border-left:10px solid var(--tc);background:#F8F5FF;border-radius:14px;padding:6px 14px;font:700 24px var(--fb)}
.pr.me{background:#FFF3C4}.pr b{font:700 26px var(--fd)}.pr small{opacity:.7;font-size:20px}
.pc2{display:flex;align-items:center;gap:6px;border-radius:999px;padding:2px 14px 2px 6px}.pc2.C{background:#D9F5E4}.pc2.D{background:#FFE6D1}.pc2 b{font:700 26px var(--fd);margin-left:4px}.pc2 em{font-size:18px;font-style:normal;color:#C2282D}
.fast{font:700 24px var(--fb)}.rk.me{background:#FFF3C4}.h3s{margin-top:10px!important}.bdgs{display:flex;flex-wrap:wrap;gap:8px}
.dopt.sel{outline:6px solid var(--blue);outline-offset:4px}
.cbody h2{margin:0}
.stage.mirror{pointer-events:none}

.lr span{text-transform:none;letter-spacing:0}
.end3 h3{font-size:30px}.end3 .rk{padding:4px 12px;margin-bottom:6px;font-size:26px}.end3 .rk strong{font-size:38px}.insight{font-size:26px!important}

.end3{grid-template-columns:1fr 1.2fr 1fr!important}.end3 h3.h3s{margin-top:10px}

/* ===== Minijuegos y resultados ===== */
canvas.mg{width:100%;height:auto;display:block;border-radius:18px;background:#000;touch-action:none;cursor:crosshair;box-shadow:0 6px 0 rgba(42,33,80,.3)}
.card .cbody:has(canvas.mg){padding:18px 24px}
.pr{grid-template-columns:34px 40px 210px 1fr 150px auto!important}
.pr .mk{display:flex;gap:4px}
.marks{display:flex;gap:12px}
.tips{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:4px;font:700 22px/1.3 var(--fb)}
.pr2{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border-left:10px solid var(--tc);background:#F8F5FF;border-radius:14px;padding:8px 16px;font:700 28px var(--fb)}
.prs2{display:flex;flex-direction:column;gap:10px}
.errm.warn{color:#9A6B00;font-size:22px}
.cbody h2.q{margin:0}

</style>

<body>
<div id="viewport"><div id="root"></div></div>
<script>
/* ===== config.js ===== */
/* =====================================================================
   CONFIGURACIÓN Y CONTENIDO · edita aquí código, sala, tiempos, puntos y textos
   ===================================================================== */
window.OL = window.OL || {};
OL.CFG = {
  presenterCode: '2817',            // código de la presentadora (control suave)
  room: 'oficina-land-sala-1',      // nombre de la sala. También se puede usar ?sala=lunes en el enlace
  brokers: [                        // servidores públicos MQTT por WebSocket seguro (se prueban en orden)
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://test.mosquitto.org:8081/mqtt'
  ],
  maxPlayers: 4,
  sessionMinutes: 30,
  finishBonus: [5, 3, 2, 1],        // XP por orden de llegada a la Dirección
  hopMs: 230,
  ptsPerStep: 3,                    // cada 3 puntos de la ronda = 1 casilla extra
  maxBonusSteps: 3,
  coopGoal: 0.6,                    // meta compartida: % del puntaje máximo de la sala
  coopBonus: 2,                     // XP extra por persona si se cumple la meta
  topBonus: 2,                      // XP extra a quien lidera una ronda de ranking
  countdownMs: 3500,                // cuenta regresiva antes de los minijuegos
  colors: [
    { k: 'red', n: 'Rojo', hex: '#E5484D' }, { k: 'purple', n: 'Morado', hex: '#8E4EC6' }, { k: 'yellow', n: 'Amarillo', hex: '#F5C400' },
    { k: 'blue', n: 'Azul', hex: '#3E8EF7' }, { k: 'orange', n: 'Naranja', hex: '#F76B15' }, { k: 'green', n: 'Verde', hex: '#30A46C' }
  ],
  teamColors: ['#E5484D', '#3E8EF7', '#30A46C', '#F5A400'],
  teamNames: ['Rojo', 'Azul', 'Verde', 'Ámbar']
};

/* Mapa de casillas (31): S inicio · n normal · D reto doble · C concepto · P prompt · B insignia · X atasco · L parada · F llegada */
OL.TILES = 'S' + 'nDCDXDBDLn' + 'nDCLDXDPDnC' + 'nPCLBCPnF';
OL.DISTRICT = (i) => i <= 10 ? 1 : i <= 21 ? 2 : 3;
OL.DISTRICTS = {
  1: { n: 'Distrito 1 · Cubículos', mech: 'Ranking individual', color: '#3E8EF7', rule: 'Cada quien suma puntos para liderar.' },
  2: { n: 'Distrito 2 · Sala de juntas', mech: 'Meta compartida', color: '#F76B15', rule: 'Los puntos de todos suman a una meta común.' },
  3: { n: 'Distrito 3 · Capacitación', mech: 'Gran final', color: '#30A46C', rule: 'Ronda final con puntos dobles.' }
};
OL.LANDMARKS = {
  9: { n: 'Cafetería', who: 'Capi Café', tip: 'Las pausas son retroalimentación informal. ¿Cuándo da retroalimentación tu documentación?' },
  14: { n: 'Sala de juntas', who: 'Don Marcador', tip: 'Aquí cambia la mecánica: de competir a una meta compartida.' },
  25: { n: 'Sala de capacitación', who: 'Dra. Pixel', tip: 'Ya casi llegan a la Dirección.' }
};
OL.STICKY = {
  5: { n: 'Impresora atascada', who: 'Imprix', tip: 'Los castigos deben ser pocos y justos. La fricción excesiva desmotiva.' },
  16: { n: 'Reunión eterna', who: 'Lord Excel', tip: 'Una penalización sin aprendizaje solo frustra.' }
};
OL.ITEMS = {
  life: { n: 'Vida extra', ico: 'heart', d: 'Perdona un fallo: ese minijuego cuenta como acierto.' },
  double: { n: 'Doble XP', ico: 'bolt', d: 'Duplica los puntos que ganes en esta ronda.' },
  jump: { n: 'Atajo', ico: 'flag', d: 'Avanzas 3 casillas extra al cerrar la ronda.' }
};
OL.BADGES = {
  curioso: { n: 'Curioso/a', ico: 'spark', d: 'Descubriste una casilla sorpresa' },
  explorador: { n: 'Explorador/a', ico: 'target', d: 'Llegaste a una casilla sorpresa' },
  constante: { n: 'Constante', ico: 'medal', d: 'Sigues avanzando sin rendirte' },
  perfecto: { n: 'Ronda perfecta', ico: 'star', d: 'Acertaste los tres minijuegos de una ronda' },
  rayo: { n: 'Rayo', ico: 'bolt', d: 'Terminaste primero una ronda con aciertos' },
  lider: { n: 'Líder del ranking', ico: 'podium', d: 'Lideraste una ronda de ranking' },
  equipo: { n: 'Meta compartida', ico: 'people', d: 'La sala cumplió una meta compartida' }
};
OL.SURPRISE = ['curioso', 'explorador', 'constante'];

/* ---------------------------------------------------------------------
   MINIJUEGOS (se dibujan en js/microgames.js). tip = idea de gamificación que ilustra
   --------------------------------------------------------------------- */
OL.MG = {
  collect: { t: '¡Recoge todas las insignias!', secs: 6, tip: 'Insignias: reconocen logros concretos y dan ganas de completar la colección.' },
  greater: { t: '¿Cuál da más XP?', secs: 4, tip: 'Puntos: comparar valores en el acto es retroalimentación inmediata.' },
  paint: { t: '¡Pinta más que el rival!', secs: 7, tip: 'Ranking: competir contra otros eleva el ritmo, pero no motiva a todos por igual.' },
  wanted: { t: '¡Atrapa al buscado!', secs: 5, tip: 'Retos: una meta clara (encuentra al buscado) concentra la atención.' },
  level: { t: '¡Sube de nivel!', secs: 5, tip: 'Niveles: una barra de progreso visible hace sentir que avanzas.' },
  prompt: { t: '¡Elige el prompt completo!', secs: 5, tip: 'Prompts: rol, audiencia, objetivo, mecánica, límites y formato.' },
  order: { t: '¡Ordena los 4 pasos!', secs: 7, tip: 'Método: objetivo, aprendiz, mecánica y medición, en ese orden.' },
  catch: { t: '¡Atrapa 6 puntos!', secs: 6, tip: 'Retroalimentación: ver cada punto caer refuerza la conducta correcta.' }
};
OL.ROUNDS = [
  { mech: 'ranking', d: 1, mult: 1, t: 'Ronda 1 · Ranking', games: ['collect', 'greater', 'paint'], blurb: 'Tres minijuegos seguidos. Quien sume más puntos lidera el ranking.' },
  { mech: 'ranking', d: 1, mult: 1, t: 'Ronda 2 · Ranking', games: ['wanted', 'level', 'prompt'], blurb: 'Otros tres minijuegos, un poco más rápidos.' },
  { mech: 'coop', d: 2, mult: 1, t: 'Ronda 3 · Meta compartida', games: ['catch', 'order', 'collect'], blurb: 'Ahora los puntos de todos suman a una meta común.' },
  { mech: 'coop', d: 2, mult: 1, t: 'Ronda 4 · Meta compartida', games: ['greater', 'wanted', 'level'], blurb: 'La sala completa necesita llegar a la meta.' },
  { mech: 'ranking', d: 3, mult: 2, final: true, t: 'Gran final · puntos dobles', games: ['paint', 'prompt', 'order'], blurb: 'Última ronda con puntos dobles. ¡Todo cuenta!' }
];

/* ---------------------------------------------------------------------
   CURSO (en orden). kind: cover | cards | flip | elements | poll | steps | prompts | rules
   --------------------------------------------------------------------- */
OL.COURSE = [
  { id: 'cover', kind: 'cover', min: 0.5, kick: 'Curso + minijuegos · Technical Writers que serán Instructional Designers',
    t: 'Gamifica tu contenido', sub: 'Del Technical Writing al Instructional Design, jugando.',
    say: ['Confirma que las 4 personas ya entraron con su nombre.', 'Estructura: curso corto (unos 10 min) y después una partida de minijuegos (unos 12 min).', 'Avanza con el botón Siguiente o con las flechas del teclado.'] },
  { id: 'shift', kind: 'cards', min: 1, kick: 'Punto de partida', t: 'De Technical Writer a Instructional Designer',
    cards: [
      { h: 'Lo que ya haces bien', p: 'Claridad, estructura y conocer a tu audiencia.', c: 'blue' },
      { h: 'Lo que cambia', p: 'Ya no solo explicas cómo se usa algo: diseñas para que la persona lo practique y cambie lo que hace.', c: 'orange' },
      { h: 'Lo que sumas', p: 'Objetivos de aprendizaje, práctica, retroalimentación y medición.', c: 'green' }],
    say: ['Conecta con su experiencia: ya dominan la claridad.', 'La gamificación es una herramienta del lado «diseñar para la práctica».'] },
  { id: 'que', kind: 'flip', min: 1.5, kick: 'Concepto', t: '¿Qué es gamificar?', note: 'Usar elementos de juego en contextos que no son juegos para influir en conductas de aprendizaje.',
    cards: [
      { h: 'Es', p: 'Diseñar con intención.', back: 'Ej.: convertir el onboarding de la API en misiones con niveles.', c: 'blue' },
      { h: 'Busca', p: 'Práctica y constancia.', back: 'Ej.: que el lector ejecute el código, no solo lo lea.', c: 'purple' },
      { h: 'No es', p: 'Puntos al azar.', back: 'Ej.: poner un ranking de lectura a un manual de referencia.', c: 'red' }],
    say: ['Pide que toquen cada tarjeta para ver el ejemplo de Technical Writing.', 'Insiste: el juego es el medio; el objetivo es la conducta.'] },
  { id: 'elem', kind: 'elements', min: 2, kick: 'Concepto', t: 'Los elementos básicos',
    say: ['No leas todo. Que cada persona explore uno.', 'Los minijuegos de hoy usan los cinco.'] },
  { id: 'p_el', kind: 'poll', min: 1, kick: 'Ponlo a prueba', q: 'Muchos lectores abandonan tu tutorial de API en el paso 2. Quieres que vean su avance y se animen a terminar. ¿Qué elemento usarías primero?',
    o: ['Un ranking global de lectores', 'Niveles con una barra de progreso', 'Puntos por abrir cada página'], correct: 1,
    why: 'Los niveles con progreso visible dan retroalimentación y una meta cercana. Un ranking global puede desanimar a quien recién empieza, y los puntos por abrir páginas premian la lectura, no la práctica.',
    say: ['Que respondan y pulsa «Mostrar resultado».', 'Pregunta a quien eligió ranking por qué.'] },
  { id: 'sdt', kind: 'cards', min: 1, kick: 'Motivación', t: 'Por qué funciona: autodeterminación',
    cards: [
      { h: 'Autonomía', p: 'Elegir el camino, el ritmo o el reto.', c: 'blue' },
      { h: 'Competencia', p: 'Sentir que dominas algo con práctica y retroalimentación.', c: 'purple' },
      { h: 'Relación', p: 'Aprender con otras personas y sentirse parte.', c: 'orange' }],
    foot: 'Ryan y Deci: si un elemento de juego no apoya ninguna de las tres, probablemente sobra.',
    say: ['Explica brevemente las tres necesidades.'] },
  { id: 'minis', kind: 'cards', min: 1.5, kick: 'Método', t: 'Microjuegos: el bucle corto',
    cards: [
      { h: 'Reto', p: 'Una instrucción clara de una sola frase: «¡Recoge todo!».', c: 'blue' },
      { h: 'Acción', p: 'Cinco segundos para actuar, con una mecánica simple.', c: 'orange' },
      { h: 'Feedback', p: 'Acierto o fallo al instante, y vuelves a intentarlo.', c: 'green' }],
    foot: 'En documentación: un mini reto de 30 segundos al final de cada sección («¿dónde va este parámetro?») sigue el mismo bucle.',
    say: ['Aquí se explica por qué jugarán minijuegos: son un bucle reto, acción y feedback.', 'Pregunta: ¿qué mini reto pondrían al final de una guía de su producto?'] },
  { id: 'steps', kind: 'steps', min: 1, kick: 'Método', t: 'Diseña en 4 pasos',
    steps: [
      { h: 'Objetivo', p: 'Que el lector haga su primera llamada a la API en 10 minutos.' },
      { h: 'Aprendiz', p: 'Desarrolladores nuevos, poco tiempo, mucha curiosidad.' },
      { h: 'Mecánica', p: 'Niveles con progreso visible y una insignia de «Primera llamada».' },
      { h: 'Medición', p: 'Prueba con 5 personas y mide cuántas terminan.' }],
    say: ['Es una secuencia real: sin objetivo no sabes qué premiar.'] },
  { id: 'prompts', kind: 'prompts', min: 1, kick: 'MetaMate', t: 'Arma tu prompt',
    parts: [['Rol', 'Diseñador instruccional experto en gamificación'], ['Audiencia', 'Developers nuevos en tu plataforma'], ['Objetivo', 'Que hagan su primera llamada a la API'], ['Mecánica', 'Niveles, insignias, retos'], ['Límites', 'Tiempo, plataforma, tono'], ['Formato', 'Tabla, guion o lista']],
    example: 'Actúa como diseñador instruccional experto en gamificación. Audiencia: developers nuevos en nuestra plataforma. Objetivo: que hagan su primera llamada a la API. Mecánica: niveles e insignias. Límites: 10 minutos, tono cercano. Formato: tabla con actividad, mecánica y cómo medir.',
    say: ['MetaMate es la IA con motor Claude que usarán en el taller.', 'Pide que justifique y mida: es lo que más diferencia a un buen prompt.'] },
  { id: 'p_prompt', kind: 'poll', min: 1, kick: 'Ponlo a prueba', q: 'Quieres que MetaMate te ayude a que tu equipo adopte la guía de estilo. ¿Qué prompt es mejor?',
    o: ['Hazme un juego para la guía de estilo.',
      'Actúa como diseñador instruccional experto en gamificación. Audiencia: 12 technical writers. Objetivo: que apliquen la guía de estilo en sus borradores. Mecánica: retos por equipo. Límites: 2 semanas. Formato: tabla con actividad, mecánica y cómo medir.',
      'Actúa como diseñador instruccional. Crea una actividad gamificada para la guía de estilo.'], correct: 1,
    why: 'La opción B incluye rol, audiencia, objetivo, mecánica, límites y formato. La C tiene rol y tema, pero no objetivo ni formato. La A casi no dice nada.',
    say: ['Pregunta por qué la opción B incluye «más cosas».'] },
  { id: 'p_mode', kind: 'poll', min: 0.5, kick: 'Antes de jugar', q: '¿Qué te motiva más en un juego de aprendizaje?',
    o: ['Competir contra el grupo (ranking)', 'Sumar a una meta compartida', 'Superar mi propio récord'],
    say: ['Guarda este resultado: al final lo compararás con cómo rindieron en las rondas de ranking y de meta compartida.'] },
  { id: 'rules', kind: 'rules', min: 1, kick: 'Ahora, a jugar', t: 'Cómo se juega Oficina Land',
    say: ['Cada ronda: cartas, 3 minijuegos y resultados.', 'Las rondas 1, 2 y 5 son de ranking; las rondas 3 y 4 son de meta compartida. No lo anticipes: deja que lo noten.'] }
];

/* Quiz final individual (cada persona, a su ritmo) */
OL.QUIZ = [
  { q: '¿Qué hace que un microjuego sea un buen bucle de gamificación?', o: ['Reto claro, acción simple y feedback inmediato', 'Muchas reglas y mucho texto', 'Que dure varios minutos'], a: 0, why: 'El bucle corto (reto, acción, feedback) permite practicar y repetir.' },
  { q: '¿Qué cambió entre las rondas de ranking y las de meta compartida?', o: ['Los minijuegos eran otros', 'La mecánica de recompensa: de competir a sumar a una meta común', 'El número de jugadores'], a: 1, why: 'Los minijuegos son del mismo tipo. Cambió cómo se premia, y con ello la motivación.' },
  { q: 'Al diseñar una actividad gamificada, ¿cuál es el primer paso?', o: ['Elegir las insignias', 'Definir el objetivo de aprendizaje', 'Escoger la herramienta'], a: 1, why: 'Sin un objetivo claro no sabes qué conducta premiar.' },
  { q: '¿Qué riesgo tiene un ranking individual en un equipo de writers?', o: ['Puede empujar a competir y desmotivar a quien va abajo', 'Hace que todos colaboren más', 'No tiene ningún riesgo'], a: 0, why: 'Úsalo con cuidado, o prueba un ranking por equipos o una meta común.' },
  { q: '¿Qué conviene incluir en un prompt para MetaMate?', o: ['Solo el tema del curso', 'Rol, audiencia, objetivo, mecánica, límites y formato', 'Únicamente el formato de salida'], a: 1, why: 'Esas seis partes dan contexto suficiente para una respuesta útil.' }
];
OL.ELEMS = [
  { k: 'Puntos', ico: 'star', use: 'Dar retroalimentación inmediata del avance.', care: 'Que premien actividad vacía en lugar de aprendizaje.', ex: 'XP por ejecutar un ejemplo de código, no por abrir la página.' },
  { k: 'Insignias', ico: 'medal', use: 'Reconocer logros y hitos concretos.', care: 'Que sean tan fáciles que nadie las valore.', ex: 'Insignia «Primera llamada a la API» tras ejecutar el ejemplo.' },
  { k: 'Niveles', ico: 'steps', use: 'Mostrar progreso y dificultad creciente.', care: 'Que el salto entre niveles sea demasiado grande.', ex: 'Quickstart → Guías → Referencia avanzada.' },
  { k: 'Ranking', ico: 'podium', use: 'Comparar resultados y dar un empujón competitivo.', care: 'Desmotiva a quien va abajo y puede romper la colaboración.', ex: 'Ranking por equipo de writers en lugar de individual.' },
  { k: 'Retos', ico: 'puzzle', use: 'Dar metas claras con un recurso limitado.', care: 'Retos sin sentido para el trabajo real.', ex: 'Depura un ejemplo de código roto en 5 minutos.' }
];

OL.NOTES = {
  lobby: { t: 'Jugadores', say: ['Confirma que aparecen las personas que van a jugar (máximo 4).', 'Pulsa «Formar jugadores» y después «Comenzar partida».'] },
  card: { t: 'Cartas de la ronda', say: ['Pulsa «Robar cartas»: cada persona saca su carta y su ficha avanza.', 'Lee en voz alta las casillas especiales (insignia, atasco, parada).', 'Pide que activen poderes si tienen. Luego pulsa «Lanzar minijuegos».'] },
  act: { t: 'Minijuegos en curso', say: ['Todas juegan a la vez en su computador: es una cuenta regresiva de 3 segundos.', 'Cuando terminen todas, pulsa «Cerrar y ver resultados». Si alguien se atrasa, puedes cerrar igual.'] },
  reveal: { t: 'Resultados', say: ['Lee la idea de gamificación que ilustra cada minijuego.', 'Pregunta: ¿qué te motivó más, competir o sumar a la meta?'] },
  debrief: { t: 'Resultados y debrief', say: ['Compara el rendimiento en rondas de ranking y de meta compartida.', 'Revisa la encuesta «¿Qué te motiva más?» frente a lo que ocurrió.', 'Conclusión: el mismo tipo de minijuego cambia según la mecánica de recompensa.'] },
  workshop: { t: 'Taller con MetaMate', say: ['Que copien el prompt 1 en MetaMate para analizar su partida.', 'Luego que adapten el prompt 2 a un tutorial o guía de su empresa.'] },
  quiz: { t: 'Mini quiz', say: ['Cada persona responde en su computador, a su ritmo.'] },
  close: { t: 'Cierre', say: ['Compromiso: gamificar una sola actividad esta semana.', 'Objetivo, mecánica, prompt, prueba con 5 personas.'] }
};

/* ===== icons.js ===== */
/* Iconos de papel y utilidades visuales compartidas. */
(function () {
  'use strict';
  const OL = window.OL;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  OL.esc = esc;
  OL.$ = (s, r = document) => r.querySelector(s); OL.$$ = (s, r = document) => [...r.querySelectorAll(s)];
  OL.fmt = (s) => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  /* ---------- Iconos ---------- */

/* ===== store.js ===== */
/* Capa de datos: sala compartida por MQTT sobre WebSocket (varias computadoras) o modo local (un solo equipo). */
(function () {
  'use strict';
  const OL = window.OL;
  const merge = (a, b) => { const o = Object.assign({}, a); for (const k in b) { o[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && o[k] && typeof o[k] === 'object') ? merge(o[k], b[k]) : b[k]; } return o; };
  const enc = new TextEncoder(), dec = new TextDecoder();
  const qs = new URLSearchParams(location.search);

  /* ---------- Cliente MQTT 3.1.1 mínimo (QoS 0, retención) ---------- */
  function MQTT(url, cb) {
    let ws = null, buf = new Uint8Array(0), ping = null, closed = false, up = false, everUp = false;
    const cid = 'ol' + Math.random().toString(36).slice(2, 12);
    const str = (s) => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
    const rl = (n) => { const o = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0); return o; };
    const send = (a) => { if (ws && ws.readyState === 1) ws.send(new Uint8Array(a)); };
    const subs = new Set();
    function open() {
      try { ws = new WebSocket(url, 'mqtt'); } catch (e) { cb.state('fail'); return; }
      ws.binaryType = 'arraybuffer'; buf = new Uint8Array(0);
      ws.onopen = () => { const vh = [0, 4, 77, 81, 84, 84, 4, 2, 0, 30], pl = str(cid); send([0x10, ...rl(vh.length + pl.length), ...vh, ...pl]); };
      ws.onmessage = (e) => { const d = new Uint8Array(e.data); const nb = new Uint8Array(buf.length + d.length); nb.set(buf); nb.set(d, buf.length); buf = nb; parse(); };
      ws.onerror = () => { };
      ws.onclose = () => { up = false; clearInterval(ping); if (closed) return; if (!everUp) { closed = true; cb.state('fail'); return; } cb.state('down'); setTimeout(() => { if (!closed) open(); }, 2000); };
    }
    function parse() {
      for (;;) {
        if (buf.length < 2) return;
        let mult = 1, len = 0, i = 1, b;
        do { if (i >= buf.length) return; b = buf[i++]; len += (b & 127) * mult; mult *= 128; } while (b & 128 && i < 5);
        if (buf.length < i + len) return;
        const type = buf[0] >> 4, flags = buf[0] & 15, body = buf.slice(i, i + len);
        buf = buf.slice(i + len);
        if (type === 2) { if (body[1] === 0) { up = true; everUp = true; subs.forEach(f => sub(f)); clearInterval(ping); ping = setInterval(() => send([0xC0, 0]), 20000); cb.state('up'); } else cb.state('fail'); }
        else if (type === 3) { const tl = (body[0] << 8) | body[1], topic = dec.decode(body.slice(2, 2 + tl)); let off = 2 + tl; if ((flags >> 1) & 3) off += 2; cb.msg(topic, dec.decode(body.slice(off)), !!(flags & 1)); }
      }
    }
    function sub(filter) { const pl = [0, 1, ...str(filter), 0]; send([0x82, ...rl(pl.length), ...pl]); }
    open();
    return {
      subscribe(f) { subs.add(f); if (up) sub(f); },
      publish(topic, payload, retain) { const t = str(topic), p = enc.encode(payload || ''); send([0x30 | (retain ? 1 : 0), ...rl(t.length + p.length), ...t, ...p]); },
      get up() { return up; },
      close() { closed = true; clearInterval(ping); try { ws && ws.close(); } catch (e) { } }
    };
  }
  /* Prueba los servidores en orden hasta que uno responda */
  function connectAny(urls, onState) {
    return new Promise((resolve, reject) => {
      let winner = null, failed = 0; const conns = [];
      urls.forEach((url) => {
        const handlers = {
          msg: (...a) => { if (handlers.relay) handlers.relay(...a); },
          state: (s) => {
            if (winner && winner.handlers === handlers) { if (onState) onState(s); return; }
            if (winner) return;
            if (s === 'up') { winner = { c, url, handlers }; conns.forEach(x => { if (x.c !== c) x.c.close(); }); clearTimeout(to); resolve(winner); }
            else if (s === 'fail') { failed++; if (failed >= urls.length && !winner) { clearTimeout(to); reject(new Error('sin servidor')); } }
          }
        };
        const c = MQTT(url, handlers); conns.push({ c });
      });
      const to = setTimeout(() => { if (!winner) { conns.forEach(x => x.c.close()); reject(new Error('sin servidor')); } }, 6000);
    });
  }

  /* ---------- db y sala sobre MQTT ---------- */
  function mqttBackend(c, handlers, prefix, uid) {
    const cache = {}, subs = [], peers = {}, ph = [], rh = [];
    let me = {};
    const snap = (path) => ({ id: path.split('/').pop(), exists: !!cache[path], data: () => cache[path] ? JSON.parse(JSON.stringify(cache[path])) : undefined });
    const inColl = (path, coll) => path.startsWith(coll + '/') && path.split('/').length === coll.split('/').length + 1;
    const notify = () => subs.slice().forEach(f => f());
    handlers.relay = (topic, payload) => {
      if (!topic.startsWith(prefix)) return;
      const path = topic.slice(prefix.length);
      if (path.startsWith('presence/')) { try { const d = JSON.parse(payload); peers[path.slice(9)] = { p: d, at: Date.now() }; firePeers(); } catch (e) { } return; }
      if (path === 'react') { try { const d = JSON.parse(payload); rh.forEach(f => f({ data: d })); } catch (e) { } return; }
      if (!payload) delete cache[path]; else { try { cache[path] = JSON.parse(payload); } catch (e) { return; } }
      notify();
    };
    c.subscribe(prefix + '#');
    const doc = (path) => ({
      path, id: path.split('/').pop(),
      async get() { return snap(path); },
      async set(data) { cache[path] = JSON.parse(JSON.stringify(data)); c.publish(prefix + path, JSON.stringify(data), true); notify(); },
      async delete() { delete cache[path]; c.publish(prefix + path, '', true); notify(); },
      onSnapshot(next) { let last = null; const f = () => { const v = JSON.stringify(cache[path] || null); if (v !== last) { last = v; next(snap(path)); } }; subs.push(f); setTimeout(f, 0); return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); }; }
    });
    const collection = (path) => {
      const list = () => Object.keys(cache).filter(k => inColl(k, path)).sort().map(snap);
      return {
        path, doc: (id) => doc(path + '/' + id),
        async get() { const docs = list(); return { docs, size: docs.length }; },
        onSnapshot(next) { let last = ''; const f = () => { const docs = list(), v = JSON.stringify(docs.map(x => [x.id, x.data()])); if (v !== last) { last = v; next({ docs, size: docs.length }); } }; subs.push(f); setTimeout(f, 0); return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); }; }
      };
    };
    const list = () => { const now = Date.now(); return Object.keys(peers).filter(k => k !== uid && now - peers[k].at < 16000).map(k => ({ peer: k, presence: peers[k].p, isMe: false })); };
    const firePeers = () => { const l = [{ peer: uid, presence: me, isMe: true }].concat(list()); ph.forEach(f => f({ peers: l })); };
    const beat = () => { c.publish(prefix + 'presence/' + uid, JSON.stringify(me), false); };
    setInterval(() => { beat(); firePeers(); }, 6000);
    const room = {
      presence: async (patch) => { me = Object.assign({}, me, patch); beat(); firePeers(); },
      onPeers: (f) => { ph.push(f); setTimeout(firePeers, 50); return () => { ph.splice(ph.indexOf(f), 1); }; },
      emit: async (topic, data) => { c.publish(prefix + 'react', JSON.stringify(data), false); },
      on: (topic, f) => { rh.push(f); return () => { rh.splice(rh.indexOf(f), 1); }; }
    };
    return { db: { doc, collection }, room, paths: () => Object.keys(cache) };
  }

  /* ---------- Modo local (misma máquina, varias pestañas) ---------- */
  function localDB() {
    const KEY = 'ol3db', subs = [];
    let chan = null; try { chan = 'BroadcastChannel' in window ? new BroadcastChannel('ol3') : null; } catch (e) { }
    const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
    const write = (d) => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { } try { chan && chan.postMessage(1); } catch (e) { } notify(); };
    const notify = () => subs.slice().forEach(f => f());
    if (chan) chan.onmessage = () => notify();
    window.addEventListener('storage', (e) => { if (e.key === KEY) notify(); });
    const snapDoc = (path, d) => ({ id: path.split('/').pop(), exists: !!d, data: () => d ? JSON.parse(JSON.stringify(d)) : undefined });
    const inColl = (path, coll) => path.startsWith(coll + '/') && path.split('/').length === coll.split('/').length + 1;
    function doc(path) {
      return {
        path, id: path.split('/').pop(),
        async get() { return snapDoc(path, read()[path]); },
        async set(data) { const d = read(); d[path] = JSON.parse(JSON.stringify(data)); write(d); },
        async delete() { const d = read(); delete d[path]; write(d); },
        onSnapshot(next) { let last = ''; const f = () => { const v = JSON.stringify(read()[path] || null); if (v !== last) { last = v; next(snapDoc(path, read()[path])); } }; subs.push(f); setTimeout(f, 0); return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); }; }
      };
    }
    function collection(path) {
      const list = () => { const d = read(); return Object.keys(d).filter(k => inColl(k, path)).sort().map(k => snapDoc(k, d[k])); };
      return {
        path, doc: (id) => doc(path + '/' + id),
        async get() { const docs = list(); return { docs, size: docs.length }; },
        onSnapshot(next) { let last = ''; const f = () => { const docs = list(), v = JSON.stringify(docs.map(x => [x.id, x.data()])); if (v !== last) { last = v; next({ docs, size: docs.length }); } }; subs.push(f); setTimeout(f, 0); return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); }; }
      };
    }
    return { doc, collection };
  }
  function localRoom(self) {
    let ch = null; try { ch = new BroadcastChannel('ol3room'); } catch (e) { }
    const peers = {}, hs = [], rs = []; let me = {};
    const send = (m) => { try { ch && ch.postMessage(m); } catch (e) { } };
    const beat = () => send({ t: 'p', id: self, p: me });
    if (ch) ch.onmessage = (e) => { const m = e.data; if (!m) return; if (m.t === 'p') { peers[m.id] = { p: m.p, at: Date.now() }; fire(); } if (m.t === 'r') rs.forEach(f => f({ data: m.d })); };
    const list = () => { const now = Date.now(); return Object.keys(peers).filter(k => now - peers[k].at < 7000).map(k => ({ peer: k, presence: peers[k].p, isMe: false })); };
    const fire = () => { const l = [{ peer: self, presence: me, isMe: true }].concat(list()); hs.forEach(f => f({ peers: l })); };
    setInterval(() => { beat(); fire(); }, 2500);
    return {
      presence: async (patch) => { me = Object.assign({}, me, patch); beat(); fire(); },
      onPeers: (f) => { hs.push(f); setTimeout(fire, 50); return () => { hs.splice(hs.indexOf(f), 1); }; },
      emit: async (topic, data) => { send({ t: 'r', d: data }); rs.forEach(f => f({ data })); },
      on: (topic, f) => { rs.push(f); return () => { rs.splice(rs.indexOf(f), 1); }; }
    };
  }
  OL.localDB = localDB;

  /* ---------- Store ---------- */
  const Store = OL.Store = {
    mode: 'local', uid: null, role: 'participant', db: null, room: null, error: null, myResp: { a: {} }, myPlayer: null, online: true, roomName: '',
    async init() {
      let id = null; try { id = localStorage.getItem('ol3uid') || sessionStorage.getItem('ol3uid'); } catch (e) { }

      try { localStorage.setItem('ol3uid', id); } catch (e) { try { sessionStorage.setItem('ol3uid', id); } catch (x) { } }

      if (qs.get('uid')) id = 'u_' + qs.get('uid').replace(/[^a-z0-9]/gi, '').slice(0, 12);
      this.uid = id;
      const room = (qs.get('sala') || OL.CFG.room).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || 'sala';
      this.roomName = room;

      try {

        if (this.role !== 'presenter' && Object.keys(this.myResp.a).length) this.db.doc('resp/' + this.uid).set(this.myResp);

    subPlayers(cb) { return this.db.collection('players').onSnapshot((q) => cb(q.docs.map(d => Object.assign({ uid: d.id }, d.data())))); },
    subResp(cb) { return this.db.collection('resp').onSnapshot((q) => { const m = {}; q.docs.forEach(d => { m[d.id] = d.data(); }); cb(m); }); },

    setPlayer(data) { this.myPlayer = data; return this.db.doc('players/' + this.uid).set(data); },
    answer(key, val) {

    },
    loadMyResp(map) { if (map[this.uid] && map[this.uid].a && !Object.keys(this.myResp.a).length) this.myResp = { a: Object.assign({}, map[this.uid].a) }; },
    async clearAll() {
      for (const c of ['resp', 'players']) { const q = await this.db.collection(c).get(); for (const d of q.docs) { await this.db.doc(c + '/' + d.id).delete(); } }

    },

    onPeers(cb) { try { return this.room && this.room.onPeers((c) => cb(c.peers)); } catch (e) { } },
    react(e) { try { this.room && this.room.emit('react', { e }); } catch (x) { } },
    onReact(cb) { try { return this.room && this.room.on('react', (m) => cb(m.data)); } catch (e) { } }
  };
})();

/* ===== engine.js ===== */
/* Motor del juego: lo ejecuta la presentadora; todas las personas renderizan el mismo estado. */
(function () {
  'use strict';
  const OL = window.OL, C = OL.CFG;
  const E = OL.Engine = {};
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  /* ---------- Ruta ---------- */
  OL.PATH = (function () {
    const p = [];
    for (let x = 1; x <= 7; x++) p.push([x, 12]);
    for (let y = 11; y >= 8; y--) p.push([7, y]);
    for (let x = 7; x >= 1; x--) p.push([x, 7]);

    if (mine.length >= n) {
      const sc = quizScore(mine);
      return { key: 'qr' + sc.pct, html: card({ rib: sc.pct >= 70 ? '#30A46C' : '#E5484D', ico: 'trophy', kick: 'Tu resultado', w: 1000, body: `<h2>${sc.ok} de ${n} · ${sc.pct}%</h2><p class="lead">${sc.pct >= 70 ? '¡Bien! Pasaste el quiz.' : 'Repasa los conceptos y vuelve a intentarlo.'}</p><div class="qlist">${OL.QUIZ.map((q, i) => `<span class="${mine[i] === q.a ? 'ok' : 'no'}">${ico(mine[i] === q.a ? 'check' : 'cross', 'ico xs')}Pregunta ${i + 1}</span>`).join('')}</div>`, foot: btn('Reintentar', 'quizReset', [], 'sec') }) };
    }
    const Q = OL.QUIZ[mine.length];
    return { key: 'q' + mine.length, html: card({ rib: '#8E4EC6', ico: 'puzzle', kick: `Pregunta ${mine.length + 1} de ${n}`, w: 1300, body: `<h2 class="q">${esc(Q.q)}</h2><div class="opts">${Q.o.map((o, i) => `<button type="button" class="opt" data-act="quizpick" data-args="[${i}]"><i>${LET[i]}</i><span>${esc(o)}</span></button>`).join('')}</div>` }) };
  }
  function closeCard(S) {
    const mine = myAns('quiz'), sc = mine && mine.length >= OL.QUIZ.length ? quizScore(mine) : null, xp = S.xp[Store.uid] || 0;
    return { key: 'close' + xp + (sc ? sc.pct : ''), html: card({ rib: '#E5484D', ico: 'flag', kick: 'Siguiente paso', w: 1500, cls: 'wide',
      body: `<h2>Gamifica una actividad esta semana</h2><div class="trio"><div class="mini c-blue"><b>1. Objetivo</b><span>Elige un contenido (tutorial, guía) y define qué debe lograr la persona.</span></div><div class="mini c-purple"><b>2. Minijuego + prompt</b><span>Pide a MetaMate ideas de minijuegos de 30 segundos con el prompt de seis partes.</span></div><div class="mini c-orange"><b>3. Prueba y mide</b><span>Pruébalo con 5 personas y ajusta.</span></div></div><p class="lead sm">${pres() ? 'Sesión completa.' : `Tu XP: <b>${xp}</b>${sc ? ' · Quiz: <b>' + sc.pct + '%</b>' : ''}.`}</p>` }) };
  }
  function waitCard() {
    return { key: 'wait', html: card({ rib: '#3E8EF7', ico: 'dice', kick: 'Oficina Land', w: 1000, cls: 'hero', body: `<h1 class="logo-h" style="font-size:96px">Oficina Land</h1><p class="lead">${pres() ? 'Todo listo. Pulsa «Iniciar sesión» cuando quieras comenzar.' : 'Estás dentro. Espera a que la presentadora inicie la sesión.'}</p>`, foot: pres() ? btn('Iniciar sesión', 'E:startSession', [], 'big') : '' }) };
  }

  /* =================== ESCENARIO =================== */
  let board = null, root = null, lastKey = '';
  function build() {
    root = $('#root'); root.classList.add('stage');
    root.innerHTML = `<div class="bgfx"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>
      <svg class="board" viewBox="-700 -190 1400 920" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tablero isométrico de la oficina"></svg>
      <div class="topbar"><div class="logo" aria-hidden="true"><span>Oficina</span><b>Land</b></div><div class="crumb" id="crumb"></div><div class="chips"><span id="online"></span><span id="clock"></span><span class="me" id="me"></span></div></div>
      <div class="hud lboard" id="lbox"></div><div class="side-wrap" id="sidew"></div><div class="mebox" id="mebox"></div>
      <div class="ov" id="ov"></div><div class="reacts" id="reacts"></div><div class="rbar2" id="rbar2"></div>
      <div class="dock" id="dock"></div><aside class="notes" id="notes" hidden></aside><div class="toasts" id="toasts"></div>`;
    board = OL.Board.build($('.board', root));
    $('#rbar2').innerHTML = ['👏', '🔥', '💡', '😮', '😂'].map(e => `<button type="button" class="rb" data-act="react" data-args='["${e}"]' aria-label="Reacción ${e}">${e}</button>`).join('');
    UI.ready = true;
  }
  function crumb(S) {
    if (!S) return 'Oficina Land';
    if (S.phase === 'course') return `Curso · ${S.slide + 1}/${OL.COURSE.length} · ${OL.COURSE[S.slide].t || OL.COURSE[S.slide].kick}`;
    if (S.phase === 'lobby') return 'Juego · Jugadores';
    if (S.phase === 'game') return `Juego · ${OL.ROUNDS[S.round - 1].t}`;
    return { debrief: 'Resultados finales', workshop: 'Taller con MetaMate', quiz: 'Mini quiz', close: 'Cierre' }[S.phase] || '';
  }
  function lbox(S) {
    const el = $('#lbox'); if (!S || !['game', 'lobby'].includes(S.phase) || !S.teams.length) { el.style.display = 'none'; return; }
    el.style.display = '';
    const R = S.phase === 'game' ? OL.ROUNDS[S.round - 1] : null, rows = ranking(S);
    setHtml(el, `<h4>${R && R.mech === 'coop' ? 'XP · meta compartida' : 'Ranking individual'}</h4>` + rows.map((r, i) => `<div class="lr ${r.uid === Store.uid ? 'me' : ''}"><b>${i + 1}</b>${OL.pawn(OL.tcolor(r.team), 'pawn s')}<span>${esc(r.name)}</span><strong>${r.xp}</strong></div>`).join(''));
  }
  function mebox(S) {
    const el = $('#mebox'); if (pres() || !S || !S.teams.length || !['game', 'lobby'].includes(S.phase)) { el.style.display = 'none'; return; }
    const t = myTeam(S); el.style.display = '';
    setHtml(el, t ? `<div class="mb" style="--tc:${OL.tcolor(t)}">${OL.pawn(OL.tcolor(t), 'pawn s')}<div><b>${esc(UI.name)}</b><span>XP ${S.xp[Store.uid] || 0} · casilla ${t.pos}</span></div></div>${t.items.length ? '<div class="mbi">' + [...new Set(t.items)].map(k => `<span title="${OL.ITEMS[k].d}">${ico(OL.ITEMS[k].ico, 'ico xs', true)}${OL.ITEMS[k].n}</span>`).join('') + '</div>' : ''}` : '<div class="mb"><b>Observando</b></div>');
  }
  function modalFor(S) {
    if (!S) return waitCard();
    if (S.phase === 'course') return slideCard(S);
    if (S.phase === 'lobby') return lobbyCard(S);
    if (S.phase === 'game') {
      if (S.step === 'card') return cardStep(S);
      const wait = S.moveEnd - Date.now();
      if (S.step === 'reveal' && wait > 0) { setTimeout(render, wait + 40); return null; }
      if (S.step === 'act') return actCard(S);
      if (S.step === 'reveal') return revealCard(S);
    }
    if (S.phase === 'debrief') return debriefCard(S);
    if (S.phase === 'workshop') return workCard(S);
    if (S.phase === 'quiz') return quizCard(S);
    if (S.phase === 'close') return closeCard(S);
    return null;
  }
  function dock(S) {
    const el = $('#dock'); if (!pres()) { el.style.display = 'none'; return; }
    el.style.display = '';
    const B = (l, a, g, c) => btn(l, 'E:' + a, g, c || 'sec s');
    let h = '';
    if (!S) h = B('Iniciar sesión', 'startSession', [], 'big');
    else if (S.phase === 'course') {
      const sl = OL.COURSE[S.slide];
      h = B('◀', 'slide', [-1]) + (sl.kind === 'poll' ? B(S.reveal[sl.id] ? 'Ocultar resultado' : 'Mostrar resultado', 'revealPoll', [sl.id]) : '') + B(S.slide === OL.COURSE.length - 1 ? 'Ir a jugadores ▶' : 'Siguiente ▶', 'slide', [1], 'big s');
    } else if (S.phase === 'lobby') h = B('Formar jugadores', 'formTeams', []) + B('Añadir rezagados', 'addLate', []) + B('Comenzar partida ▶', 'startGame', [], 'big s');
    else if (S.phase === 'game') {
      if (S.step === 'card') h = S.cardsDrawn ? B('Lanzar minijuegos ▶', 'launch', [], 'big s') : B('Robar cartas', 'drawCards', [], 'big s');
      else if (S.step === 'act') h = B('Cerrar y ver resultados', 'closeAct', [], 'big s');
      else if (S.step === 'reveal') h = B(S.round >= OL.ROUNDS.length ? 'Resultados finales ▶' : 'Siguiente ronda ▶', 'next', [], 'big s');
    } else if (S.phase === 'debrief') h = B('Taller con MetaMate ▶', 'go', ['workshop'], 'big s');
    else if (S.phase === 'workshop') h = B('Mini quiz ▶', 'go', ['quiz'], 'big s');
    else if (S.phase === 'quiz') h = B('Cierre ▶', 'go', ['close'], 'big s');
    else if (S.phase === 'close') h = B('Volver a resultados', 'go', ['debrief']);
    const slides = S ? `<select id="jump" aria-label="Ir a…"><option value="">Ir a…</option>${OL.COURSE.map((c, i) => `<option value="s${i}">Curso ${i + 1}. ${esc(c.t || c.kick)}</option>`).join('')}<option value="lobby">Jugadores</option><option value="debrief">Resultados</option><option value="workshop">Taller</option><option value="quiz">Quiz</option><option value="close">Cierre</option></select>` : '';
    h += `<span class="sp"></span>${slides}${btn(UI.notes ? 'Ocultar guion' : 'Guion', 'notes', [], 'sec s')}${UI.confirmReset ? btn('Sí, reiniciar todo', 'E:resetAll', [], 'danger s') + btn('No', 'confirmReset', [], 'sec s') : btn('Reiniciar', 'confirmReset', [], 'sec s')}`;
    setHtml(el, h);
  }
  function notes(S) {
    const el = $('#notes'); el.hidden = !(pres() && UI.notes); if (el.hidden) return;
    let n;
    if (!S) n = { t: 'Inicio', say: ['Pulsa «Iniciar sesión».'] };
    else if (S.phase === 'course') { const sl = OL.COURSE[S.slide]; n = { t: sl.t || sl.kick, say: sl.say || [], min: sl.min }; }
    else if (S.phase === 'game') n = Object.assign({}, OL.NOTES[S.step === 'idle' ? 'card' : S.step], { t: OL.ROUNDS[S.round - 1].t });
    else n = OL.NOTES[S.phase] || { t: '', say: [] };
    const extra = (S && S.phase === 'course' && OL.COURSE[S.slide].correct != null) ? `<p class="say"><b>Correcta:</b> ${LET[OL.COURSE[S.slide].correct]}</p>` : '';
    setHtml(el, `<p class="kk">Guion de la presentadora${n.min ? ' · ≈ ' + n.min + ' min' : ''}</p><h3>${esc(n.t)}</h3><ul>${(n.say || []).map(x => `<li>${x}</li>`).join('')}</ul>${extra}`);
  }
  function render() {
    if (!UI.ready) return;
    const S = OL.live, P = pres();
    if (S && S.epoch && S.epoch !== UI.epoch) { if (UI.epoch !== undefined && UI.epoch !== null) { Store.myResp = { a: {} }; UI.mg = null; if (UI.role === 'participant') Store.setPlayer({ name: UI.name, ts: Date.now(), role: 'participant' }); } UI.epoch = S.epoch; }
    const show = S && ['game', 'lobby', 'debrief'].includes(S.phase) && S.teams.length > 0;
    board.update(S, { show, mine: (myTeam(S) || {}).id, allTags: P && S && S.phase !== 'game' });
    root.classList.toggle('dim', !show); root.classList.toggle('hashud', !!(S && ['game', 'lobby'].includes(S.phase) && S.teams.length));
    $('#crumb').textContent = crumb(S);
    lbox(S); mebox(S); dock(S); notes(S);
    const side = $('#sidew'), m = modalFor(S), peeking = Date.now() < UI.peekUntil, isSide = m && m.html.startsWith('<div class="side">'), ov = $('#ov');
    if (isSide) { ov.innerHTML = ''; ov.classList.remove('on'); lastKey = ''; if (side.dataset.k !== m.key) { side.dataset.k = m.key; side.innerHTML = m.html; } }
    else {
      side.innerHTML = ''; side.dataset.k = '';
      const key = (m ? m.key : '') + (peeking ? 'peek' : '');
      if (key !== lastKey) {
        const ae = document.activeElement;
        if (m && ae && ov.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) { UI.pending = true; return; }
        if (UI.mg && UI.mg.ctl && !(m && m.after)) { UI.mg.ctl.stop(); }
        lastKey = key; ov.innerHTML = (m && !peeking) ? `<div class="mwrap">${m.html}</div>` : ''; ov.classList.toggle('on', !!(m && !peeking));
        if (m && S && S.phase === 'workshop') { const b = $('#pB'); if (b) b.value = promptB(); }
        if (m && m.after && !peeking) m.after();
      }
    }
    tick();
  }
  function tick() {
    const S = OL.live, el = $('#clock'); if (!el) return;
    const t0 = S && S.t0 ? (Date.now() - S.t0) / 1000 : 0; el.textContent = '⏱ ' + OL.fmt(t0) + ' / ' + C.sessionMinutes + ':00'; el.classList.toggle('over', t0 > C.sessionMinutes * 60);
    const on = $('#online'); if (on) { const n = OL.playersList().length; on.textContent = (Store.mode === 'mqtt' ? (Store.online ? '🟢' : '🔴') : '🟡') + ' ' + n + ' en sala'; on.title = Store.mode === 'mqtt' ? 'Conectada a la sala ' + Store.roomName : 'Modo local: solo este equipo'; }
  }
  OL.render = render;

  /* =================== ACCIONES =================== */
  function bindEvents() {
    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
      const act = b.dataset.act, a = JSON.parse(b.dataset.args || '[]');
      if (act.startsWith('E:')) { if (pres()) OL.Engine[act.slice(2)](...a); return; }
      switch (act) {
        case 'poll': Store.answer('p_' + a[0], a[1]); render(); break;
        case 'pu': { const cur = (myAns('pu' + a[0]) || []).slice(); const i = cur.indexOf(a[1]); if (i >= 0) cur.splice(i, 1); else cur.push(a[1]); Store.answer('pu' + a[0], cur); render(); break; }
        case 'quizpick': { const cur = (myAns('quiz') || []).slice(); cur.push(a[0]); Store.answer('quiz', cur); render(); break; }
        case 'quizReset': Store.answer('quiz', []); render(); break;
        case 'flip': { const fa = $('.fa', b), fb = $('.fb', b); fb.hidden = !fb.hidden; fa.hidden = !fb.hidden; break; }
        case 'elem': UI.elem = a[0]; render(); break;
        case 'peek': UI.peekUntil = Date.now() + 8000; render(); setTimeout(render, 8100); break;
        case 'notes': UI.notes = !UI.notes; render(); break;
        case 'confirmReset': UI.confirmReset = !UI.confirmReset; render(); break;
        case 'react': Store.react(a[0]); break;
        case 'copy': copyFrom(a[0]); break;
      }
    });
    root.addEventListener('change', (e) => { if (e.target.id === 'jump' && pres() && e.target.value) { const v = e.target.value; if (/^s\d+$/.test(v)) OL.Engine.setSlide(+v.slice(1)); else OL.Engine.go(v); } });
    root.addEventListener('input', (e) => { if (e.target.closest('.wk')) { const b = $('#pB'); if (b) b.value = promptB(); } });
    root.addEventListener('focusout', () => { if (UI.pending) setTimeout(() => { UI.pending = false; render(); }, 60); });
    addEventListener('keydown', (e) => { if (!pres() || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) return; const S = OL.live; if (S && S.phase === 'course') { if (e.key === 'ArrowRight') OL.Engine.slide(1); else if (e.key === 'ArrowLeft') OL.Engine.slide(-1); } });
  }
  async function copyFrom(id) {
    const ta = $('#' + id), msg = $('#' + (id === 'pA' ? 'cA' : 'cB'));
    try { await navigator.clipboard.writeText(ta.value); msg.textContent = 'Copiado.'; } catch (e) { ta.focus(); ta.select(); msg.textContent = 'Selecciona y copia con Ctrl+C.'; }
    setTimeout(() => { if (msg) msg.textContent = ''; }, 3000);
  }
  function floatEmoji(e) { const r = $('#reacts'); if (!r) return; const s = document.createElement('span'); s.textContent = String(e && e.e || '👏').slice(0, 4); s.style.left = (60 + Math.random() * 360) + 'px'; r.appendChild(s); setTimeout(() => s.remove(), 2600); }

  /* =================== LOGIN Y ARRANQUE =================== */
  function loginHtml(err) {
    return `<div class="ov on login"><div class="mwrap"><div class="card" style="--rib:#E5484D;width:1060px"><div class="rib">${ico('dice', 'ico rib-ico', true)}<span>Oficina Land · Entrar</span></div>
      <div class="cbody"><h1 class="logo-h" style="font-size:96px">Oficina Land</h1>
      <div class="tabs" role="tablist"><button type="button" class="tabb ${UI.tab === 'p' ? 'on' : ''}" data-tab="p" role="tab">Participante</button><button type="button" class="tabb ${UI.tab === 'x' ? 'on' : ''}" data-tab="x" role="tab">Presentadora</button></div>
      ${UI.tab === 'p' ? `<label class="lbl" for="inName">Tu nombre</label><input class="inp" id="inName" maxlength="18" placeholder="Ej.: Ana" autocomplete="off" value="${esc(UI.name || '')}"><p class="sm mut">Entras como participante y sigues la sesión en tu computador.</p>`
        : `<label class="lbl" for="inCode">Código de la presentadora</label><input class="inp" id="inCode" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">`}
      ${err ? `<p class="errm">${err}</p>` : ''}${Store.warn ? `<p class="errm warn">${Store.warn}</p>` : ''}</div><div class="foot"><button type="button" class="btn big" id="inGo">Entrar</button></div></div></div></div>`;
  }
  function showLogin(err) {
    root = $('#root'); root.classList.add('stage'); root.innerHTML = `<div class="bgfx"><i class="cloud c1"></i><i class="cloud c2"></i></div>` + loginHtml(err);
    $$('.tabb', root).forEach(b => b.addEventListener('click', () => { UI.tab = b.dataset.tab; showLogin(); }));
    const go = () => {
      if (UI.tab === 'p') { const n = ($('#inName').value || '').trim(); if (!n) return showLogin('Escribe tu nombre para entrar.'); enter('participant', n); }
      else { const c = ($('#inCode').value || '').trim(); if (c !== C.presenterCode) return showLogin('Código incorrecto.'); enter('presenter', 'Presentadora'); }
    };
    $('#inGo').addEventListener('click', go);
    root.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    const f = $('#inName') || $('#inCode'); if (f) f.focus();
  }
  async function enter(role, name) {
    UI.role = role; UI.name = name; Store.role = role;
    try { sessionStorage.setItem('ol3role', role); localStorage.setItem('ol3name', name); } catch (e) { }
    build(); bindEvents();
    if (role === 'participant') Store.setPlayer({ name, ts: Date.now(), role: 'participant' });
    $('#me').textContent = role === 'presenter' ? 'Presentadora' : name;
    Store.presence({ name, role });
    Store.subLive((s) => { OL.live = s; render(); });
    Store.subPlayers((l) => { OL.players = l; render();
      if (role === 'participant' && !l.some(p => p.uid === Store.uid) && !UI.regTimer) { UI.regTimer = setTimeout(() => { UI.regTimer = null; if (!OL.players.some(p => p.uid === Store.uid)) Store.setPlayer({ name, ts: Date.now(), role: 'participant' }); }, 2500); } });
    Store.subResp((m) => { OL.resp = m; Store.loadMyResp(m); render(); });
    Store.onReact(floatEmoji);
    Store.onStatus = () => tick();
    setInterval(tick, 500);
  }
  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('#root').style.transform = `translate(-50%,-50%) scale(${s})`; }
  addEventListener('resize', fit);
  async function boot() {
    fit();
    root = $('#root'); root.classList.add('stage'); root.innerHTML = '<div class="bgfx"></div><div class="ov on"><div class="mwrap"><div class="card" style="--rib:#3E8EF7;width:900px"><div class="rib"><span>Conectando con la sala…</span></div><div class="cbody"><p class="lead">Un momento, buscando el servidor de la sala.</p></div></div></div></div>';
    await Store.init();
    let role = null, name = ''; try { role = sessionStorage.getItem('ol3role'); name = localStorage.getItem('ol3name') || ''; } catch (e) { }
    UI.name = name;
    if (role === 'participant' && name) enter(role, name); else showLogin();
  }
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(boot);
})();

</script>
</body>
</html>
